# ---------------------------------------------------------------------------------------------------------------------
# This workflow handles manual deployments for custom projects (https://github.com/openremote/custom-project), see
# deployment.yml for how deployments work.
#
# MANUAL TRIGGER
#
# The calling workflow defines the following inputs, they override secrets with the same name but not values from the
# '.ci_cd/env' files:
#
# - ENVIRONMENT           - Which environment to deploy, leave empty to only use '.ci_cd/env/.env' and secrets without
#                           an environment prefix
# - CLEAN_INSTALL         - Should the .ci_cd/host_init/clean.sh script be run during deployment (warning this will delete
#                           assets, rules, etc.)
# - COMMIT                - Which branch/SHA should be checked out for the deployment (defaults to trigger commit)
# - OR_HOSTNAME           - FQDN of host to deploy to (e.g. demo.openremote.app)
# - OR_ADMIN_PASSWORD     - The admin password to set for clean installs
#
# The manager docker image always matches the openremote version in 'gradle/libs.versions.toml'. Trigger it on a
# branch: on a tag the 'workflow_dispatch' deploy entry in '.ci_cd/ci_cd.json' is used instead of ENVIRONMENT, and the
# run fails without one.
#
# USAGE
#
# Call this workflow from a workflow_dispatch workflow in the custom project:
#
#   on:
#     workflow_dispatch:
#       inputs:
#         ENVIRONMENT:
#           description: "Environment to use (if any)"
#         CLEAN_INSTALL:
#           description: "Delete data before starting"
#           type: boolean
#         COMMIT:
#           description: "Repo branch or commit SHA to checkout"
#         OR_HOSTNAME:
#           description: "Host to deploy to (e.g. demo.openremote.app)"
#         OR_ADMIN_PASSWORD:
#           description: "Admin password override"
#
#   jobs:
#     call-main-repo:
#       name: CI/CD
#       uses: openremote/core/.github/workflows/custom-deploy.yml@main
#       with:
#         INPUTS: ${{ toJSON(github.event.inputs) }}
#       secrets: inherit
#
# The calling workflow must be on the default branch before it can be triggered from the GitHub UI, and must not use
# the same concurrency group as this workflow, GitHub cancels the run as a deadlock.
# ---------------------------------------------------------------------------------------------------------------------

name: Custom deploy

on:
  workflow_call:
    inputs:
      INPUTS:
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment:
    name: Deployment
    uses: "./.github/workflows/deployment.yml"
    with:
      INPUTS: ${{ inputs.INPUTS }}
      COMMIT: ${{ fromJSON(inputs.INPUTS || '{}').COMMIT }}
    secrets: inherit
